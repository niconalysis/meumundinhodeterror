<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Mundinho de Terror</title>
<meta name="description" content="Livros, filmes e séries de terror, suspense e true crime, com opinião sincera.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Fraunces:opsz,wght,SOFT,WONK@9..144,900,100,1&display=swap">
<style>
:root{--bg:#1A120C;--amber:#F0A33A;--bone:#F2E8D7;--wood:#C9A67B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(70% 60% at 50% 0%,#F0A33A26,transparent),var(--bg);color:var(--bone);font:17px/1.6 "Figtree",system-ui,sans-serif;display:grid;place-items:center;padding:48px 20px}
main{max-width:520px;width:100%;display:flex;flex-direction:column;gap:22px;text-align:center}
h1{margin:0;font:900 clamp(44px,11vw,68px)/.92 "Fraunces",Georgia,serif;font-variation-settings:"SOFT" 100,"WONK" 1;text-wrap:balance}
h1 span{color:var(--amber);display:block}
p{margin:0;color:var(--wood)}
nav{display:flex;flex-direction:column;gap:10px;margin-top:8px}
nav a{display:block;padding:14px 18px;border:2px solid var(--amber);border-radius:999px;color:var(--bone);text-decoration:none;font-weight:600}
nav a:hover,nav a:focus-visible{background:var(--amber);color:var(--bg);outline:none}
footer{font-size:14px;color:var(--wood)}
footer a{color:var(--wood)}
</style>
</head>
<body>
<main>
  <h1>Meu Mundinho <span>de Terror</span></h1>
  <p>Livros, filmes e séries de terror, suspense e true crime, com opinião sincera. Bem-vindo ao lado trevoso.</p>
  <nav>
    <a href="https://www.youtube.com/@meumundinhodeterror">YouTube</a>
    <a href="https://www.instagram.com/meumundinhodeterror">Instagram</a>
    <a href="https://www.tiktok.com/@meumundinhodeterror">TikTok</a>
  </nav>
  <footer>Contato: meumundinhodeterror@gmail.com · <a href="privacidade.html">Política de privacidade</a></footer>
</main>
</body>
</html>
